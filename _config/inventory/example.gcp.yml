---
# Copy to inventory/gcp.yml (gitignored) and set your real project id.
# Auth uses Application Default Credentials:
#   gcloud auth application-default login
plugin: gcp_compute
projects:
  - example-gcp-project-id
auth_kind: application
keyed_groups:
  # Group by network tag -> vm_tag_<tag> (e.g. vm_tag_k3s), per the playbooks.
  - key: tags["items"]
    prefix: vm_tag
compose:
  # Connect over the instance external IP with the gcloud-managed key.
  ansible_host: networkInterfaces[0].accessConfigs[0].natIP
  # Metadata-SSH username (local part of key).
  # For OS Login use e.g. 'andre_p41_bizee_com'.
  ansible_user: "'andre'"
  ansible_ssh_private_key_file: "'~/.ssh/google_compute_engine'"
